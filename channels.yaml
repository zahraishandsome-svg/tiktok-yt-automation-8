# TikTok to YouTube Channel Pairs

channels:
  - id: channel_7
    tiktok_username: "official_yeetfeet"
    youtube_channel_name: "official_yeetfeet"
    # The Google account that owns this YouTube channel (owns tiktok-yt-channel7-503015).
    owner_email: "i9464926@gmail.com"
    # No fixed_title — the TikTok caption is used as the YouTube title.
    google_credentials_file: "credentials/channel_7_client_secret.json"
    oauth_token_file: "tokens/channel_7_token.json"
    videos_per_day: 2
    description_footer: ""
    default_tags:
      - yeetfeet
      - viral
      - trending
    youtube_category_id: "22"
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    upload_mode: popular_split
    # Slot 1 = newest unposted TikTok. Slot 2 = most-VIEWED unposted TikTok
    # (across the whole profile). Both upload as Shorts.
    max_download_candidates: 15
    # Caption dedup: before uploading, skip any TikTok whose caption already exists
    # among ALL videos on the YouTube channel (catches manual uploads). The channel
    # is small (~74 videos) so scanning all of them is cheap and complete.
    youtube_uploads_playlist: "UUvgOmL0dKeJPrhEDgeFhvRw"
    slot_publish_times_utc:
      1: "22:00"   # PUBLIC at 6 PM ET (US)
      2: "00:00"   # PUBLIC at 8 PM ET (US)
